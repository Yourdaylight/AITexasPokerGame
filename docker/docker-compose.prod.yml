version: "2"

services:
  nginx:
    build:
      context: ../client
      args:
        NODE_ENV: production
        IDENTIFY_VERSION_KEY: ${IDENTIFY_VERSION_KEY}
    container_name: "dzp-nginx"
    restart: always
    ports:
      - 1111:80
    volumes:
      - ./config/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./config/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - app-network

  api:
    build:
      context: ../server
      args:
        NODE_ENV: production
        IDENTIFY_VERSION_KEY: ${IDENTIFY_VERSION_KEY}
    container_name: "dzp-api"
    restart: always
    environment:
      NODE_ENV: production
      POKER_DB_PATH: /data/poker.db
      AI_API_URL: ${AI_API_URL:-https://api.minimaxi.com/v1/chat/completions}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-MiniMax-M2.7}
    expose:
      - 7001
    volumes:
      - ./data/poker.db:/data/poker.db
      - ./data/server/logs:/root/logs
      - ./data/server/run:/app/run
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
